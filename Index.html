
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Kid Càfé</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8ee;
      color: #38251b;
      text-align: center;
    }

    header {
      background: #542d1d;
      color: white;
      padding: 25px 10px;
    }

    nav a {
      color: white;
      margin: 8px;
      text-decoration: none;
    }

    .hero {
      padding: 55px 15px;
    }

    .hero h2 {
      font-size: 32px;
    }

    .menu {
      background: white;
      padding: 25px;
      margin: 15px;
      border-radius: 12px;
    }

    .contact {
      display: inline-block;
      background: #218838;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      background: #542d1d;
      color: white;
      padding: 15px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Kid Càfé ☕</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#menu">Menu</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h2>Welcome to Kid Càfé</h2>
    <p>Good coffee. Great moments.</p>
    <a class="contact"
       href="#menu">Explore Our Menu</a>
  </section>

  <section class="menu" id="menu">
    <h2>Our Menu</h2>
    <p>☕ Coffee — KSh 150</p>
    <p>🍵 Tea — KSh 100</p>
    <p>🥪 Sandwich — KSh 250</p>
  </section>

  <section class="menu" id="contact">
    <h2>Visit Us</h2>
    <p>Fresh drinks and a welcoming atmosphere.</p>
    <p>Contact us to learn more.</p>
  </section>

  <footer>
    <p>Kid Càfé | Made with care</p>
  </footer>
</body>
</html>
